name: Release OmniFloat

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Windows Standalone Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags "desktop,production" -ldflags "-H windowsgui -s -w" -o dist/omnifloat-windows-amd64.exe .
          Copy-Item "dist/omnifloat-windows-amd64.exe" "dist/omnifloat.exe"
          Compress-Archive -Path "dist/omnifloat.exe" -DestinationPath "dist/omnifloat-windows-amd64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*

  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential

      - name: Build Linux AMD64 Binary
        run: |
          mkdir -p build/bin dist
          go build -tags "desktop,production" -ldflags "-s -w" -o build/bin/omnifloat .

      - name: Package .deb and .tar.gz
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi

          # Compress standalone binary
          cd build/bin
          tar -czvf "../../dist/omnifloat-linux-amd64.tar.gz" omnifloat
          cd ../..

          # Build Debian package structure
          DEB_ROOT="build/deb/omnifloat_${VERSION}_amd64"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/usr/share/applications"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "${DEB_ROOT}/DEBIAN"

          cp build/bin/omnifloat "${DEB_ROOT}/usr/bin/"
          chmod 755 "${DEB_ROOT}/usr/bin/omnifloat"
          cp build/appicon.png "${DEB_ROOT}/usr/share/icons/hicolor/64x64/apps/omnifloat.png"

          cat << 'EOF' > "${DEB_ROOT}/usr/share/applications/omnifloat.desktop"
          [Desktop Entry]
          Name=OmniFloat
          Comment=Minimalist Glassmorphism Floating Launcher
          Exec=/usr/bin/omnifloat
          Icon=omnifloat
          Terminal=false
          Type=Application
          Categories=Utility;System;
          StartupNotify=true
          EOF

          cat << EOF > "${DEB_ROOT}/DEBIAN/control"
          Package: omnifloat
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0
          Maintainer: rac-developer <developer@omnifloat.local>
          Description: Minimalist Glassmorphism Floating Launcher
           Native floating launcher written in Go and Wails v2 with Glassmorphism UI.
          EOF

          dpkg-deb --build "${DEB_ROOT}" "dist/omnifloat-linux-amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Determine Release Tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OmniFloat ${{ steps.meta.outputs.tag }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
